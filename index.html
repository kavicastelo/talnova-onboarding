<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Security Metadata Directives -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:8080 ws://localhost:8080 https: wss:; object-src 'none'; base-uri 'self';"
    />

    <!-- Client-Side Frame-Busting Script (Defense-in-depth Clickjacking & Iframe Sandboxing Protection) -->
    <script>
      // Defense-in-depth Clickjacking & Iframe Sandboxing Protection
      if (window.top !== window.self) {
        try {
          if (window.top.location.hostname !== window.self.location.hostname) {
            window.top.location = window.self.location;
          }
        } catch (e) {
          window.top.location = window.self.location;
        }
      }
    </script>

    <title>Employee Onboarding Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
